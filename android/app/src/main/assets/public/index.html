<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006b5f">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Study Tracker</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <main id="view" aria-live="polite"></main>
  <button class="fab" id="fab" type="button" data-act="log" aria-label="Log study time"></button>
  <nav class="bar" id="nav" aria-label="Main"></nav>
  <div id="layer"></div>
  <div class="snack" id="snack" role="status" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
